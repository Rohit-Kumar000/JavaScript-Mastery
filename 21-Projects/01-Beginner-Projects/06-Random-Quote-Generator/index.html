<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="quote-container">

        <div class="quote-header">
            <span class="badge">DAILY INSPIRATION</span>

            <h1>Random Quote</h1>

            <p>Get a little inspiration with every click.</p>
        </div>


        <div class="quote-card">

            <div class="quote-icon">“</div>

            <p class="quote-text" id="quoteText">
                The only way to do great work is to love what you do.
            </p>

            <div class="quote-author">
                <span></span>
                <p id="quoteAuthor">Steve Jobs</p>
            </div>


            <div class="quote-actions">

                <button class="copy-btn" id="copyQuote">
                    Copy Quote
                </button>

                <button class="new-quote-btn" id="newQuote">
                    New Quote
                    <span>↻</span>
                </button>

            </div>

        </div>


        <div class="quote-footer">
            <p>Quote <span id="quoteNumber">01</span></p>

            <div class="dots">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>

    </main>
</body>
<script src="script.js"></script>
</html>
