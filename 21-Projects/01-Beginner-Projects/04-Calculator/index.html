<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="calculator">

        <div class="top">
            <div>
                <h2>Calculator</h2>
                <p>Let's calculate</p>
            </div>

            <div class="dot"></div>
        </div>


        <div class="display">

            <div class="previous-value" id="previousValue">
            </div>
                0
            <div class="current-value" id="currentValue">
                
            </div>

        </div>


        <div class="buttons">

            <button class="btn clear" id="clear">AC</button>
            <button class="btn delete" id="delete">DEL</button>
            <button class="btn operator">%</button>
            <button class="btn operator">÷</button>


            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operator">×</button>


            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operator">−</button>


            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button class="btn operator">+</button>


            <button class="btn number zero">0</button>
            <button class="btn number" id="decimal">.</button>

            <button class="btn equal" id="equals">=</button>

        </div>

    </div>
</body>
<script src="script.js"></script>
</html>
