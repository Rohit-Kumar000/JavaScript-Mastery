<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="weather-app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="subtitle">WEATHER APP</p>
                <h1>Check the Weather</h1>
            </div>

            <div class="weather-icon">☀️</div>
        </header>


        <!-- Search -->
        <section class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </section>


        <!-- Weather Card -->
        <section class="weather-card">

            <div class="location">
                <span>📍</span>
                <div>
                    <h2 id="cityName">Chandigarh</h2>
                    <p id="countryName">India</p>
                </div>
            </div>


            <div class="weather-main">

                <div class="temperature">
                    <span id="temperature">28</span>
                    <span class="degree">°C</span>
                </div>

                <div class="condition">
                    <div id="weatherEmoji">☀️</div>
                    <p id="weatherCondition">Clear Sky</p>
                </div>

            </div>


            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-card">
                    <span class="detail-icon">🌡️</span>

                    <div>
                        <p>Feels Like</p>
                        <h3 id="feelsLike">29°C</h3>
                    </div>
                </div>


                <div class="detail-card">
                    <span class="detail-icon">💧</span>

                    <div>
                        <p>Humidity</p>
                        <h3 id="humidity">62%</h3>
                    </div>
                </div>


                <div class="detail-card">
                    <span class="detail-icon">💨</span>

                    <div>
                        <p>Wind Speed</p>
                        <h3 id="windSpeed">3.4 m/s</h3>
                    </div>
                </div>


                <div class="detail-card">
                    <span class="detail-icon">🌡️</span>

                    <div>
                        <p>Pressure</p>
                        <h3 id="pressure">1012 hPa</h3>
                    </div>
                </div>

            </div>

        </section>


        <!-- Status -->
        <p id="message"></p>

        <footer>
            Weather App 
        </footer>

    </main>
</body>
<script src="script.js"></script>
</html>
